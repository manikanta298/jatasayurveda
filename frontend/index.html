<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JATAS Ayurveda — Premium Ayurvedic Care & Wellness</title>
    <meta name="description" content="Physician-led Ayurvedic clinic and pharmacy. Panchakarma, chronic disease reversal and premium herbal formulations rooted in classical shastra and modern science." />
    <meta name="author" content="JATA Ayurveda" />
    <meta name="theme-color" content="#1B5E20" />
    <meta property="og:title" content="JATA Ayurveda — Premium Ayurvedic Care" />
    <meta property="og:description" content="Panchakarma, chronic disease reversal, women's health, and premium Ayurvedic products — delivered with modern precision." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600&display=swap" />
    <style>
      :root { --loader-bg:#faf7ef; --loader-ink:#16241c; --loader-green:#1b5e20; --loader-gold:#c9a227; }
      .app-loader { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:var(--loader-bg); transition:opacity .5s ease; }
      .app-loader--hide { opacity:0; pointer-events:none; }
      .loader-wrapper { position:relative; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; row-gap:.25em; column-gap:.45em; max-width:90vw; padding:1.5rem; font-family:"Poppins",sans-serif; font-size:clamp(1.15rem,5.5vw,2.35rem); font-weight:600; letter-spacing:.02em; user-select:none; color:var(--loader-ink); }
      .loader-word { display:inline-flex; white-space:nowrap; }
      .loader-shimmer { position:absolute; inset:0; z-index:1; background-color:transparent; mask:repeating-linear-gradient(90deg,transparent 0,transparent 6px,black 6px,black 9px); -webkit-mask:repeating-linear-gradient(90deg,transparent 0,transparent 6px,black 6px,black 9px); }
      .loader-shimmer::after { content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 50% 50%,var(--loader-gold) 0%,transparent 50%),radial-gradient(circle at 45% 45%,var(--loader-green) 0%,transparent 45%),radial-gradient(circle at 55% 55%,var(--loader-gold) 0%,transparent 45%); mask:radial-gradient(circle at 50% 50%,transparent 0%,transparent 10%,black 25%); -webkit-mask:radial-gradient(circle at 50% 50%,transparent 0%,transparent 10%,black 25%); animation:loader-shimmer-move 2s infinite alternate,loader-shimmer-fade 4s infinite; animation-timing-function:cubic-bezier(.6,.8,.5,1); }
      @keyframes loader-shimmer-move { 0%{transform:translate(-55%)} 100%{transform:translate(55%)} }
      @keyframes loader-shimmer-fade { 0%,100%{opacity:0} 15%{opacity:1} 65%{opacity:0} }
      .loader-letter { display:inline-block; opacity:0; animation:loader-letter-anim 4s infinite linear; z-index:2; }
      @keyframes loader-letter-anim { 0%{filter:blur(0);opacity:0} 5%{opacity:1;text-shadow:0 0 6px rgba(22,36,28,.18);filter:blur(0);transform:scale(1.1) translateY(-2px)} 20%{opacity:.2;filter:blur(0)} 100%{filter:blur(5px);opacity:0} }
      @media (prefers-reduced-motion:reduce) { .loader-letter{animation:none;opacity:1}.loader-shimmer,.loader-shimmer::after{display:none} }
    </style>
  </head>
  <body>
    <div id="app-loader" class="app-loader" role="status" aria-live="polite" aria-label="Loading JATAS Ayurvedic"><div class="loader-wrapper"><span class="loader-word" id="loader-word-1"></span><span class="loader-word" id="loader-word-2"></span><div class="loader-shimmer"></div></div></div>
    <script>
      (function(){function buildWord(id,text,start){var el=document.getElementById(id);if(!el)return start;text.split("").forEach(function(ch,i){var span=document.createElement("span");span.className="loader-letter";span.textContent=ch;span.style.animationDelay=((start+i)*.105+.1).toFixed(3)+"s";el.appendChild(span)});return start+text.length}var next=buildWord("loader-word-1","JATAS",0);buildWord("loader-word-2","AYURVEDIC",next)})();
    </script>
    <script>
      (function(){var loaderEl=document.getElementById("app-loader");if(!loaderEl)return;var MIN_VISIBLE_MS=1100,MAX_WAIT_MS=6000,start=Date.now(),hidden=false;function hideLoader(){if(hidden)return;hidden=true;loaderEl.classList.add("app-loader--hide");setTimeout(function(){if(loaderEl.parentNode)loaderEl.parentNode.removeChild(loaderEl)},500)}window.addEventListener("app:ready",function(){var wait=Math.max(0,MIN_VISIBLE_MS-(Date.now()-start));setTimeout(hideLoader,wait)},{once:true});setTimeout(hideLoader,MAX_WAIT_MS)})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
